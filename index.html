<script>
/* ============================================================
   ANALYSE — auf zwei Läufe die Woche zugeschnitten
   Methodik nach dem Bauplan von Dan Felser, Sport KI (felsr.com).
   ============================================================ */
(function(){
const A={}, day1=864e5;
const isoD=d=>new Date(d).toISOString().slice(0,10);
const pc=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0");};
const perc=(a,p)=>{if(!a.length) return 0;const b=[...a].sort((x,y)=>x-y);
  const i=(b.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);
  return lo===hi?b[lo]:b[lo]+(b[hi]-b[lo])*(i-lo);};

/* Belastung */
A.loadOf=function(h){
  const min=(h.dur||0)/60;
  if(h.run&&h.run.km>0&&h.run.min>0){
    const p=h.run.min*60/h.run.km, IF=S.pace/p;
    return {v:h.run.min*IF*IF, how:"Lauf", IF, p, min:h.run.min};
  }
  if(min>0){ const kw=S.kw||0.7, eff=h.eff||1; return {v:min*kw*eff, how:"Kraft", min, kw, eff}; }
  return {v:0, how:"ohne Dauer", min:0};
};
A.daily=function(){const m={};S.history.forEach(h=>{const d=isoD(h.date);m[d]=(m[d]||0)+A.loadOf(h).v;});return m;};
A.anchor=function(){const v=Object.values(A.daily()).filter(x=>x>0);return Math.max(30,perc(v,0.95)||0);};

A.series=function(){
  if(!S.history.length) return null;
  const m=A.daily(), days=Object.keys(m).sort();
  const out=[]; let ctl=0,atl=0;
  for(let t=new Date(days[0]); t<=new Date(); t.setDate(t.getDate()+1)){
    const k=isoD(t), l=m[k]||0, tsb=ctl-atl;
    ctl+=(l-ctl)/42; atl+=(l-atl)/7;
    out.push({d:k,l,ctl,atl,tsb});
  }
  return out;
};
A.weeks=function(n){
  n=n||12; const out=[], mo=new Date(); mo.setHours(0,0,0,0);
  mo.setDate(mo.getDate()-((mo.getDay()+6)%7));
  for(let i=n-1;i>=0;i--){
    const a=new Date(mo); a.setDate(a.getDate()-i*7);
    const b=new Date(a); b.setDate(b.getDate()+7);
    const hs=S.history.filter(h=>{const t=new Date(h.date);return t>=a&&t<b;});
    out.push({start:a, km:hs.reduce((x,h)=>x+(h.run?h.run.km:0),0),
      runs:hs.filter(h=>h.run).length, lifts:hs.filter(h=>!h.run).length,
      load:hs.reduce((x,h)=>x+A.loadOf(h).v,0), n:hs.length, current:i===0});
  }
  return out;
};
A.runs=()=>S.history.filter(h=>h.run&&h.run.km>0&&h.run.min>0)
  .sort((a,b)=>new Date(a.date)-new Date(b.date));

/* Tempo gegen ihr eigenes Wohlfühltempo */
A.paceBuckets=function(){
  const rs=A.runs(); if(!rs.length) return null;
  const b={langsam:0, wohl:0, flott:0}; let total=0;
  rs.forEach(h=>{
    const p=h.run.min*60/h.run.km; total+=h.run.km;
    if(p>S.pace+20) b.langsam+=h.run.km;
    else if(p>=S.pace-35) b.wohl+=h.run.km;
    else b.flott+=h.run.km;
  });
  return {b,total};
};
A.trend=function(){
  const rs=A.runs(); if(rs.length<6) return null;
  const k=Math.max(3,Math.floor(rs.length/3));
  const avg=arr=>arr.reduce((a,h)=>a+h.run.min*60/h.run.km,0)/arr.length;
  const first=avg(rs.slice(0,k)), last=avg(rs.slice(-k));
  return {first,last,diff:first-last,k,from:rs[0].date,to:rs[rs.length-1].date};
};
A.best=function(){
  const rs=A.runs(); if(!rs.length) return null;
  return rs.reduce((a,h)=>(h.run.km*1000/h.run.min)>(a.run.km*1000/a.run.min)?h:a);
};
A.predict=function(km){
  const b=A.best(); if(!b) return null;
  return {riegel:b.run.min*60*Math.pow(km/b.run.km,1.06), base:b, leap:km/b.run.km};
};

/* Befund */
A.finding=function(){
  const rs=A.runs(), ws=A.weeks(8).filter(w=>!w.current&&w.n>0), c=[];
  if(S.history.length<5) return null;
  const t=A.trend();
  if(t&&t.diff>8) c.push({score:t.diff, good:true, t:"Du bist schneller geworden.",
    p:"Bei gleicher Streckenlänge läufst du heute deutlich zügiger als zu Beginn. Das ist der ehrlichste Fortschritt, den diese Daten zeigen können — und er kommt vom Training, nicht vom Kalender.",
    ev:[["Tempo am Anfang", pc(t.first)+" min/km", new Date(t.from).toLocaleDateString("de-DE")],
        ["Tempo zuletzt", pc(t.last)+" min/km", new Date(t.to).toLocaleDateString("de-DE")],
        ["Unterschied", Math.round(t.diff)+" Sek/km", "über "+rs.length+" Läufe"]],
    do:"Trag das neue Tempo in den Einstellungen ein, damit die Zielpaces mitwachsen. Sonst laufen deine lockeren Läufe ab jetzt zu langsam."});
  const last4=A.weeks(5).filter(w=>!w.current);
  const few=last4.filter(w=>w.runs<2).length;
  if(few>=2) c.push({score:few*20, t:"Die Läufe fallen häufiger aus als die Krafteinheiten.",
    p:"In mehreren der letzten Wochen kamen weniger als zwei Läufe zusammen. Die Kraft läuft, die Ausdauer nicht — und die braucht am meisten Regelmäßigkeit.",
    ev:[["Wochen mit unter 2 Läufen", few+" von 4",""],
        ["Läufe gesamt", String(rs.length),"im Archiv"],
        ["Krafteinheiten", String(S.history.length-rs.length),""]],
    do:"Beide Läufe diese Woche fest in den Kalender, am besten Dienstag und Samstag früh. Lieber 3 km ruhig als ausgelassen."});
  if(rs.length>=6){
    const d=rs.slice(-6).map(h=>h.run.km), p=rs.slice(-6).map(h=>h.run.min*60/h.run.km);
    const spread=a=>(Math.max(...a)-Math.min(...a))/(a.reduce((x,y)=>x+y,0)/a.length);
    if(spread(d)<0.18&&spread(p)<0.06) c.push({score:25, t:"Deine Läufe sind alle gleich.",
      p:"Die letzten sechs Läufe hatten fast dieselbe Länge und fast dasselbe Tempo. Der Körper passt sich an, was neu ist — immer dieselbe Runde ist irgendwann keine Reizsetzung mehr.",
      ev:[["Distanzspanne", d.reduce((a,b)=>Math.min(a,b))+" bis "+d.reduce((a,b)=>Math.max(a,b))+" km",""],
          ["Tempospanne", pc(Math.min(...p))+" bis "+pc(Math.max(...p)),""],
          ["Läufe betrachtet","6","zuletzt"]],
      do:"Einen der beiden Läufe verlängern: Samstag 1,5 km mehr als sonst, dafür ruhiger."});
  }
  if(ws.length>=4){
    const a=ws.slice(-2).reduce((x,w)=>x+w.km,0)/2, b=ws.slice(-4,-2).reduce((x,w)=>x+w.km,0)/2;
    if(b>0&&a<b*0.6&&b>=6) c.push({score:(1-a/b)*60, t:"Dein Umfang ist zurückgegangen.",
      p:"Die letzten beiden Wochen liegen deutlich unter den zwei Wochen davor. Ein Rückgang wird selten benannt, ist aber genauso ein Befund wie eine Steigerung.",
      ev:[["Letzte zwei Wochen", a.toFixed(1)+" km im Schnitt",""],
          ["Zwei Wochen davor", b.toFixed(1)+" km im Schnitt",""],
          ["Veränderung", Math.round((a/b-1)*100)+" %",""]],
      do:"Diese Woche zurück auf "+(b*0.9).toFixed(1)+" km, aufgeteilt auf die beiden geplanten Läufe."});
  }
  if(!c.length) return {clean:true, t:"Dein Training läuft rund.",
    p:"In den Daten steht kein Muster, das eine Korrektur rechtfertigt. Die Einheiten kommen regelmäßig, Umfang und Tempo passen zusammen.",
    ev:[["Einheiten", String(S.history.length),"im Archiv"],
        ["Läufe", String(rs.length),""],
        ["Wochen mit Training", String(A.weeks(12).filter(w=>w.n>0).length),"von 12"]],
    do:"Weiter wie bisher. Der nächste Schritt kommt von allein, wenn du dranbleibst."};
  return c.sort((x,y)=>y.score-x.score)[0];
};

A.honesty=function(){
  const rs=A.runs(), s=A.series(), ds=Object.values(A.daily()).filter(x=>x>0), an=A.anchor();
  const over=ds.filter(x=>x/an*100>100).length;
  return {total:S.history.length, runs:rs.length, lifts:S.history.length-rs.length,
    withHR:S.history.filter(h=>h.hr).length, span:s?s.length:0,
    gaps:s?s.filter(x=>x.l===0).length:0, anchor:an, over,
    overPct:ds.length?over/ds.length*100:0, days:ds.length};
};

/* CSV */
A.parseCSV=function(txt){
  const lines=txt.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {err:"Zu wenige Zeilen."};
  const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?";":",";
  const split=l=>{const o=[];let cc="",qt=false;
    for(const ch of l){ if(ch==='"'){qt=!qt;continue;} if(ch===sep&&!qt){o.push(cc);cc="";continue;} cc+=ch; }
    o.push(cc); return o.map(x=>x.trim());};
  const head=split(lines[0]).map(h=>h.toLowerCase());
  const find=(...k)=>head.findIndex(h=>k.some(x=>h.includes(x)));
  const iD=find("datum","date","start"), iT=find("typ","type","sportart","activity type"),
        iK=find("distanz","distance","strecke"), iZ=find("bewegungszeit","moving time","zeit","time","dauer"),
        iH=find("durchschn. hf","average heart","ø hf","avg hr","herzfrequenz");
  if(iD<0||iK<0||iZ<0) return {err:"Spalten nicht erkannt. Kopfzeile: "+head.slice(0,10).join(" · ")};
  const n=v=>{v=String(v||"").trim();
    if(/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(v)) v=v.replace(/\./g,"").replace(",",".");
    else v=v.replace(",",".");
    const x=parseFloat(v); return isFinite(x)?x:0;};
  const dur=v=>{v=String(v).trim();
    if(/:/.test(v)){const p=v.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];}
    const x=n(v); return x>1000?x:x*60;};
  const rows=[]; let skipped=0;
  lines.slice(1).forEach(l=>{
    const c=split(l); if(c.length<3) return;
    const type=(iT>=0?c[iT]:"lauf").toLowerCase();
    if(!/lauf|run|jog|trail|walk|geh/.test(type)&&iT>=0) return;
    let km=n(c[iK]); if(km>200) km/=1000;
    const sec=dur(c[iZ]);
    const dt=new Date(String(c[iD]).replace(/(\d{2})\.(\d{2})\.(\d{4})/,"$3-$2-$1"));
    if(isNaN(dt)||km<=0||sec<=0){ skipped++; return; }
    rows.push({date:dt.toISOString(), day:"imp", label:"Lauf (Import)", ex:[],
      run:{km:+km.toFixed(2), min:Math.round(sec/60)}, dur:sec,
      hr:iH>=0?Math.round(n(c[iH]))||null:null, src:"csv"});
  });
  return {rows, skipped};
};
A.merge=function(rows){
  let added=0,dupes=0;
  rows.forEach(r=>{
    const d=isoD(r.date);
    if(S.history.find(h=>isoD(h.date)===d&&h.run&&Math.abs(h.run.km-r.run.km)<0.4)){dupes++;return;}
    S.history.push(r); added++;
  });
  S.history.sort((a,b)=>new Date(a.date)-new Date(b.date)); save();
  return {added,dupes};
};

/* ---------- Darstellung ---------- */
const LC=[[0,[185,166,222]],[50,[222,127,150]],[100,[158,60,80]]];
function loadColor(v){ v=Math.max(0,Math.min(100,v));
  for(let i=1;i<LC.length;i++){const [p1,c1]=LC[i-1],[p2,c2]=LC[i];
    if(v<=p2){const t=(v-p1)/(p2-p1);return "rgb("+c1.map((c,k)=>Math.round(c+(c2[k]-c)*t)).join(",")+")";}}
  return "#9E3C50";
}
const el2=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
function disc(title,val,build){
  const wrap=el2("div"), row=el2("div","row q");
  row.innerHTML=`<div class="main"><div class="t">${title}<span class="caret"></span></div></div><div class="v strong">${val}</div>`;
  const d=el2("div","disc"), inner=el2("div","inner"), pad=el2("div","pad");
  build(pad); inner.appendChild(pad); d.appendChild(inner);
  row.addEventListener("click",()=>{
    const open=d.classList.contains("open");
    wrap.parentNode.querySelectorAll(".disc.open").forEach(x=>x.classList.remove("open"));
    wrap.parentNode.querySelectorAll(".row.q.open").forEach(x=>x.classList.remove("open"));
    if(!open){ d.classList.add("open"); row.classList.add("open"); }
  });
  wrap.appendChild(row); wrap.appendChild(d); return wrap;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape")
  document.querySelectorAll(".disc.open,.row.q.open").forEach(x=>x.classList.remove("open")); });

function chart(series){
  const w=680,h=160,p=8,n=series[0].data.length;
  const max=Math.max(...series.map(s=>Math.max(...s.data)),1);
  const X=i=>p+i*(w-2*p)/Math.max(1,n-1), Y=v=>h-p-(v/max)*(h-2*p);
  let o=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
  series.forEach(s=>{
    const d=s.data.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    if(s.fill) o+=`<path d="${d} L${X(n-1)} ${h-p} L${X(0)} ${h-p} Z" fill="${s.fill}"/>`;
    o+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round"
         vector-effect="non-scaling-stroke"${s.dash?' stroke-dasharray="4 5"':""}/>`;
  });
  return o+"</svg>";
}

window.renderAnalyse=function(){
  const root=document.querySelector("#s-analyse"); if(!root) return;
  root.innerHTML="";
  root.appendChild(el2("div","lgtitle","Analyse"));
  root.appendChild(el2("div","lgsub","Aus deinen Einheiten gerechnet · jede Zahl zeigt ihren Rechenweg"));

  if(S.history.length<3){
    root.appendChild(el2("div","empty","Noch zu wenig Material.<br>Nach ein paar Einheiten entsteht hier deine Auswertung.<br>Oder importier unten deinen Export."));
    root.appendChild(imp()); return;
  }
  const H=A.honesty(), s=A.series(), an=A.anchor();

  /* Letzte Einheit */
  const last=S.history[S.history.length-1], L=A.loadOf(last), sc=L.v/an*100;
  root.appendChild(el2("div","sect","Letzte Einheit"));
  const c0=el2("div","group");
  c0.appendChild(el2("div","row",`<div class="main"><div class="t">${esc(last.label||"Einheit")}</div>
    <div class="s">${new Date(last.date).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"})}</div></div>`));
  c0.appendChild(el2("div","row",`<div class="main">
    <div class="bigload" style="color:${loadColor(sc)}">${sc.toFixed(0)}</div>
    <div class="s" style="margin-top:6px">Belastung</div></div>`));
  c0.appendChild(disc("Rechenweg", L.how, pad=>{
    pad.appendChild(el2("div","formula", L.how==="Lauf"
      ? `Intensität = Wohlfühltempo / gelaufenes Tempo\n           = ${pc(S.pace)} / ${pc(L.p)} = <b>${L.IF.toFixed(3)}</b>\n\nRohlast   = Dauer × Intensität²\n          = ${L.min} min × ${(L.IF*L.IF).toFixed(3)} = <b>${L.v.toFixed(1)}</b>\n\nAnker     = 95. Perzentil deiner Tageslasten = <b>${an.toFixed(1)}</b>\nBelastung = 100 × ${L.v.toFixed(1)} / ${an.toFixed(1)} = <b>${sc.toFixed(0)}</b>`
      : `Rohlast   = Dauer × ${String(L.kw).replace(".",",")}${L.eff!==1?" × "+String(L.eff).replace(".",","):""}  (Gewichtung je Minute)\n          = ${L.min.toFixed(0)} min × ${String(+(L.kw*L.eff).toFixed(3)).replace(".",",")} = <b>${L.v.toFixed(1)}</b>\nAnker     = <b>${an.toFixed(1)}</b>\nBelastung = <b>${sc.toFixed(0)}</b>`));
    pad.appendChild(el2("p","plain","Der Anker ist deiner: Er kommt aus deinen eigenen härtesten Tagen, nicht aus einer fremden Norm. 100 heißt so hart wie deine üblichen Spitzentage, nicht Maximum."));
    pad.appendChild(el2("p","plain","Ohne Pulsdaten wird aus Tempo und Dauer gerechnet. Das unterscheidet zügig von locker, aber nicht, wie sich der Lauf angefühlt hat."));
  }));
  root.appendChild(c0);

  /* Form */
  root.appendChild(el2("div","sect","Form<span class='aux'>42 und 7 Tage</span>"));
  const c1=el2("div","group");
  if(s.length<28){
    c1.appendChild(el2("div","row",`<div class="main"><div class="t">Noch nicht aussagekräftig</div>
      <div class="s">Deine Reihe ist ${s.length} Tage lang</div></div>`));
    c1.appendChild(disc("Warum", "", pad=>{
      pad.appendChild(el2("p","plain","Die Kurve mittelt über 42 Tage. Solange weniger da ist, zeigt sie hauptsächlich, wann du angefangen hast — nicht, wie fit du bist. Ab etwa sechs Wochen wird sie brauchbar, ab drei Monaten aussagekräftig."));
      pad.appendChild(el2("div","formula",`Fitness  = Fitness(gestern) + (Last − Fitness) / 42\nErmüdung = Ermüdung(gestern) + (Last − Ermüdung) / 7\nFrische  = Fitness(gestern) − Ermüdung(gestern)\n\nheute: <b>${s[s.length-1].ctl.toFixed(1)}</b> · <b>${s[s.length-1].atl.toFixed(1)}</b> · <b>${s[s.length-1].tsb.toFixed(1)}</b>\nnoch <b>${42-s.length}</b> Tage bis die Reihe eingeschwungen ist`));
    }));
  }else{
    const t=s[s.length-1];
    c1.appendChild(el2("div","row",`<div class="main"><div class="t">Fitness ${t.ctl.toFixed(0)}</div>
      <div class="s">Ermüdung ${t.atl.toFixed(0)} · Frische ${t.tsb>0?"+":""}${t.tsb.toFixed(0)}</div></div>`));
    const sv=el2("div","svgwrap");
    sv.innerHTML=chart([{data:s.map(x=>x.ctl),color:"#DE7F96",fill:"rgba(222,127,150,.14)"},
                        {data:s.map(x=>x.atl),color:"rgba(58,42,47,.3)",w:1.5,dash:1}]);
    c1.appendChild(sv);
    c1.appendChild(el2("div","legend",`<span><i style="background:#DE7F96"></i>Fitness</span><span><i style="background:rgba(58,42,47,.3)"></i>Ermüdung</span>`));
    c1.appendChild(disc("Rechenweg", t.ctl.toFixed(0), pad=>{
      pad.appendChild(el2("div","formula",`Fitness  = Fitness(gestern) + (Last − Fitness) / 42\nErmüdung = Ermüdung(gestern) + (Last − Ermüdung) / 7\nFrische  = Fitness(gestern) − Ermüdung(gestern)\n\nheute: Fitness <b>${t.ctl.toFixed(1)}</b>  Ermüdung <b>${t.atl.toFixed(1)}</b>  Frische <b>${t.tsb.toFixed(1)}</b>\nReihe über <b>${s.length}</b> Tage, davon <b>${H.gaps}</b> ohne Eintrag`));
      pad.appendChild(el2("p","plain","Die ersten 42 Tage sind Einschwingen, kein Zustand. Tage ohne Eintrag zählen als null — wenn du ohne App unterwegs warst, sieht die Kurve eine Pause, die es nicht gab."));
      pad.appendChild(el2("p","plain","Diese Zahlen sind mit sich selbst vergleichbar, nicht mit denen einer anderen App. Gleiche Form, andere Skala."));
    }));
  }
  root.appendChild(c1);

  /* Wochen */
  const ws=A.weeks(12);
  root.appendChild(el2("div","sect","Wochen<span class='aux'>Kilometer</span>"));
  const c2=el2("div","group");
  const mx=Math.max(...ws.map(w=>w.km),1);
  const bars=el2("div","svgwrap");
  bars.innerHTML=`<svg viewBox="0 0 680 120" preserveAspectRatio="none">`+ws.map((w,i)=>{
    const x=8+i*56, h=Math.max(3,w.km/mx*100);
    return `<rect x="${x}" y="${110-h}" width="34" height="${h}" rx="8" fill="${w.current?"rgba(58,42,47,.14)":"#DE7F96"}"/>`;
  }).join("")+`</svg>`;
  c2.appendChild(bars);
  c2.appendChild(el2("div","legend",`<span>${ws[0].start.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span><span style="margin-left:auto">laufende Woche hell</span>`));
  const done=ws.filter(w=>!w.current), a2=done.slice(-2), b2=done.slice(-4,-2);
  const avgA=a2.length?a2.reduce((x,w)=>x+w.km,0)/a2.length:0, avgB=b2.length?b2.reduce((x,w)=>x+w.km,0)/b2.length:0;
  c2.appendChild(disc("Veränderung", avgB>0?((avgA/avgB-1)*100>0?"+":"")+((avgA/avgB-1)*100).toFixed(0)+" %":"—", pad=>{
    pad.appendChild(el2("div","formula",`Letzte zwei Wochen   <b>${avgA.toFixed(1)} km</b> im Schnitt\nZwei Wochen davor    <b>${avgB.toFixed(1)} km</b> im Schnitt\nVeränderung          <b>${avgB>0?((avgA/avgB-1)*100).toFixed(0)+" %":"—"}</b>`));
    pad.appendChild(el2("p","plain","Bei deinem Umfang sind Prozentzahlen mit Vorsicht zu lesen: von 8 auf 11 Kilometer sind rechnerisch 38 Prozent und in der Praxis ein Lauf mehr. Deshalb steht hier der Vergleich über zwei Wochen statt eine — einzelne Wochen schwanken zu stark, um etwas zu bedeuten."));
  }));
  root.appendChild(c2);

  /* Tempo */
  const pb=A.paceBuckets(), tr=A.trend();
  if(pb&&pb.total>0){
    root.appendChild(el2("div","sect","Tempo<span class='aux'>gegen dein Wohlfühltempo</span>"));
    const c3=el2("div","group");
    if(tr) c3.appendChild(el2("div","row",`<div class="main">
      <div class="t">${tr.diff>3?"Du bist "+Math.round(tr.diff)+" Sekunden je Kilometer schneller geworden":tr.diff<-3?"Aktuell "+Math.round(-tr.diff)+" Sekunden je Kilometer langsamer":"Dein Tempo ist stabil"}</div>
      <div class="s">${pc(tr.first)} zu Beginn · ${pc(tr.last)} zuletzt</div></div>`));
    const mxb=Math.max(pb.b.langsam,pb.b.wohl,pb.b.flott,0.1);
    [["langsam","langsamer","#B9A6DE"],["wohl","im Wohlfühltempo","#DE7F96"],["flott","zügiger","#C25E78"]]
    .forEach(([k,l,col])=>{
      const b=el2("div","zbar");
      b.innerHTML=`<div class="zl">${l}</div><div class="ztrack">
        <div class="zfill" style="width:${(pb.b[k]/mxb*100).toFixed(1)}%;background:${col}"></div></div>
        <div class="zv">${pb.b[k].toFixed(1)} km</div>`;
      c3.appendChild(b);
    });
    c3.appendChild(disc("Wie die Bereiche entstehen", pc(S.pace)+" min/km", pad=>{
      pad.appendChild(el2("div","formula",`Wohlfühltempo (Einstellungen)  <b>${pc(S.pace)} min/km</b>\n\nlangsamer          über ${pc(S.pace+20)}\nim Wohlfühltempo   ${pc(S.pace-35)} bis ${pc(S.pace+20)}\nzügiger            schneller als ${pc(S.pace-35)}\n\nGesamt betrachtet  <b>${pb.total.toFixed(1)} km</b> aus ${A.runs().length} Läufen`));
      pad.appendChild(el2("p","plain","Die Bereiche kommen aus deinem eigenen Tempo, nicht aus einer Wettkampftabelle. Die verbreitete VDOT-Systematik setzt eine ausgefahrene Bestzeit voraus — aus lockeren Läufen lässt sich so ein Wert nicht ableiten, deshalb steht er hier nicht."));
      pad.appendChild(el2("p","plain","Ohne Höhendaten wird nicht steigungsbereinigt gerechnet: eine hügelige Runde landet zu weit im langsamen Bereich."));
    }));
    root.appendChild(c3);
  }

  /* Befund */
  const f=A.finding();
  if(f){
    root.appendChild(el2("div","sect","Befund"));
    const c4=el2("div","group");
    c4.appendChild(el2("div","row",`<div class="mark${f.good?" done":""}" style="${f.good?"":"background:var(--lav-l);color:#7B62A8"}">${f.good?"✓":"◆"}</div>
      <div class="main"><div class="t" style="font-weight:600">${esc(f.t)}</div>
      <div class="s" style="white-space:normal">${esc(f.p.slice(0,80))}…</div></div>`));
    c4.appendChild(disc("Mehr dazu","", pad=>{
      pad.appendChild(el2("p","plain","<b style='color:var(--ink)'>"+esc(f.t)+"</b>"));
      pad.appendChild(el2("p","plain",esc(f.p)));
      pad.appendChild(el2("div","formula",f.ev.map(e=>e[0].padEnd(24)+"<b>"+e[1]+"</b>"+(e[2]?"   "+e[2]:"")).join("\n")));
      pad.appendChild(el2("p","plain","<b style='color:var(--ink)'>Diese Woche:</b> "+esc(f.do)));
    }));
    root.appendChild(c4);
  }

  /* Prognose */
  const p5=A.predict(5), p10=A.predict(10);
  if(p5){
    root.appendChild(el2("div","sect","Wenn du antreten würdest"));
    const c5=el2("div","group");
    [[5,p5],[10,p10]].forEach(([d,p])=>{
      if(!p) return;
      c5.appendChild(el2("div","row",`<div class="main"><div class="t">${d} km</div>
        <div class="s">hochgerechnet aus deinem besten Lauf</div></div><div class="v strong">${fmtT(p.riegel)}</div>`));
    });
    c5.appendChild(disc("Wie das gerechnet ist","Riegel", pad=>{
      const b=p5.base;
      pad.appendChild(el2("div","formula",`Basis: <b>${b.run.km} km in ${b.run.min} min</b>  (${new Date(b.date).toLocaleDateString("de-DE")})\n\nZielzeit = Bestzeit × (Zieldistanz / Bestdistanz)^1,06`));
      pad.appendChild(el2("p","plain","Eine Hochrechnung, keine Vorhersage: Sie unterstellt, dass die Ausdauer für die längere Strecke da ist. Bei einem Sprung über das Doppelte wird sie optimistisch."+
        (p10&&p10.leap>2.5?" Für die 10 km ist dein Sprung "+p10.leap.toFixed(1)+"-fach — nimm die Zahl als grobe Richtung.":"")));
    }));
    root.appendChild(c5);
  }

  /* Ehrlichkeitscheck */
  root.appendChild(el2("div","sect","Was diese Zahlen tragen"));
  const c6=el2("div","group");
  c6.appendChild(disc("Datengrundlage", H.total+" Einheiten", pad=>{
    pad.appendChild(el2("div","formula",
`Einheiten gesamt        <b>${H.total}</b>
davon Läufe             <b>${H.runs}</b>
davon Kraft             <b>${H.lifts}</b>
mit Pulswert            <b>${H.withHR}</b>
Sekundendaten           <b>0</b>

Zeitraum                <b>${H.span} Tage</b>
davon ohne Eintrag      <b>${H.gaps}</b>
aktive Tage             <b>${H.days}</b>
Anker                   <b>${H.anchor.toFixed(1)}</b>
Tage über 100           <b>${H.over}</b> (${H.overPct.toFixed(0)} %)`));
    pad.appendChild(el2("p","plain","Die App kennt je Lauf nur Distanz und Dauer. Kein Puls Sekunde für Sekunde heißt: keine Herzfrequenzzonen, keine Belastung nach Banister, keine Bestzeit über ein gleitendes Fenster innerhalb eines Laufs. Alles hier kommt aus Tempo und Dauer und ist so beschriftet."));
    pad.appendChild(el2("p","plain","Und was diese Zahlen grundsätzlich nicht wissen: Schlaf, Stress, Krankheit, Hitze, das Leben zwischen den Einheiten. Sie sagen, wie viel du trainiert hast, nicht wie es dir geht."));
  }));
  root.appendChild(c6);

  root.appendChild(imp());
  root.appendChild(el2("div","note","Methodik nach dem Bauplan von Dan Felser, Sport KI · felsr.com. Die Daten gehören dir, der Aufbau ist seine Idee."));
};

function imp(){
  const wrap=el2("div");
  wrap.appendChild(el2("div","sect","Daten importieren"));
  const g=el2("div","group"), pad=el2("div");
  pad.style.padding="14px 16px";
  pad.innerHTML=`<p class="plain" style="margin:0 0 10px">Export aus Garmin Connect, Apple Health oder Strava (activities.csv) hier hineinkopieren. Datum, Distanz und Dauer werden selbst erkannt, auch mit Komma und Zeiten als 00:35:00. Doppelte werden zusammengeführt.</p>
    <textarea id="csvIn2" placeholder="Datum,Typ,Distanz,Zeit&#10;12.09.2026,Laufen,4,2;00:35:10"></textarea>
    <p class="plain" id="csvMsg2"></p>`;
  g.appendChild(pad);
  const b=el2("button","btn","Import prüfen");
  b.addEventListener("click",()=>{
    const r=A.parseCSV(document.querySelector("#csvIn2").value);
    const m=document.querySelector("#csvMsg2");
    if(r.err){ m.textContent=r.err; return; }
    if(!r.rows.length){ m.textContent="Keine Läufe erkannt, "+r.skipped+" Zeilen übersprungen."; return; }
    const res=A.merge(r.rows);
    m.innerHTML="<b style='color:var(--rose-d)'>"+res.added+" Einheiten übernommen</b>, "+res.dupes+" schon vorhanden, "+r.skipped+" ohne brauchbare Werte.";
    renderAll();
  });
  pad.appendChild(b);
  wrap.appendChild(g); return wrap;
}
})();
</script>

<script>
/* ============================================================
   FREIER TAG — komplett frei gestaltbar: Kraft, Ausdauer oder Ruhe
   ============================================================ */
(function(){
const nn=v=>{const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0;};
const mk=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const chev=()=>typeof CHEV!=="undefined"?CHEV:"";
const FD=()=>S.freeDay||(S.freeDay={mode:null,ex:[],type:"Laufen",min:"",km:"",eff:1,done:false});

const LIB={
 "Beine & Po":["Hip Thrust","Goblet Squat","Romanian Deadlift","Reverse Lunge","Bulgarian Split Squat","Cable Kickbacks","Abduktion am Kabel","Glute Bridge","Beinpresse","Step-Ups","Beinbeuger","Wadenheben"],
 "Rücken":["Lat Pulldown","Kabelrudern sitzend","Kurzhantel-Rudern","Face Pulls","Reverse Fly","Rückenstrecker"],
 "Schultern & Arme":["Schulterdrücken Kurzhantel","Seitheben","Frontheben","Bizeps Curl","Trizeps Pushdown","Dips an der Bank"],
 "Brust":["Brustpresse Maschine","Kurzhantel-Bankdrücken","Fliegende am Kabel","Push-ups"],
 "Core":["Plank","Side Plank","Dead Bug","Cable Crunch","Beinheben","Russian Twist","Bird Dog"]
};
const ENDU=["Laufen","Radfahren","Schwimmen","Crosstrainer","Rudern","Wandern","Tanzen / Kurs","Zügig spazieren"];
const TEMPL=[
 {n:"Po & Beine kompakt",ex:[["Hip Thrust",3,12],["Reverse Lunge",3,10],["Abduktion am Kabel",3,15],["Glute Bridge",3,15]]},
 {n:"Ganzkörper",ex:[["Goblet Squat",3,12],["Lat Pulldown",3,12],["Schulterdrücken Kurzhantel",3,10],["Dead Bug",3,12]]},
 {n:"Oberkörper & Haltung",ex:[["Kabelrudern sitzend",3,12],["Face Pulls",3,15],["Schulterdrücken Kurzhantel",3,10],["Seitheben",3,12]]}
];
const EFF=[["leicht",0.8],["gut",1],["schwer",1.25]];
const REST_TIPS=["20 Min Yoga oder Dehnen","Spaziergang an der frischen Luft","Genug trinken","Früh schlafen gehen"];

window.freeLabel=function(){
  const f=S.freeDay;
  if(!f||!f.mode) return "Freier Tag · du entscheidest";
  if(f.mode==="kraft") return "Freier Tag · Kraft"+(f.done?" ✓":"");
  if(f.mode==="ausdauer") return "Freier Tag · "+f.type+(f.done?" ✓":"");
  return "Freier Tag · Ruhe";
};

function lastKg(name){ const lp=lastPerf(name); return lp?lp.sets[0].kg:""; }

function pickSheet(){
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Übung hinzufügen"));
    p.appendChild(mk("div","sheet-s","Such dir aus, worauf du Lust hast — oder trag eine eigene ein."));
    const own=mk("div","field"); own.innerHTML='<input type="text" placeholder="Eigene Übung" autocomplete="off">';
    p.appendChild(own);
    const go=mk("button","btn sec","Eigene Übung übernehmen");
    go.addEventListener("click",()=>{ const v=own.querySelector("input").value.trim(); if(v) exSheet(null,v); });
    p.appendChild(go);
    Object.keys(LIB).forEach(grp=>{
      const h=mk("div","sect",grp); p.appendChild(h);
      const g=mk("div","group");
      LIB[grp].forEach(n=>{
        const r=mk("div","row tap");
        r.innerHTML='<div class="main"><div class="t">'+esc(n)+'</div></div>'+chev();
        r.addEventListener("click",()=>exSheet(null,n));
        g.appendChild(r);
      });
      p.appendChild(g);
    });
    const c=mk("button","btn plain","Abbrechen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

function exSheet(i,name){
  const f=FD(), edit=i!=null, x=edit?f.ex[i]:null;
  const E=edit?{n:x.n,sets:x.sets,reps:x.reps,kg:x.kg}:{n:name,sets:3,reps:12,kg:lastKg(name)};
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h",esc(E.n)));
    const lp=lastPerf(E.n);
    p.appendChild(mk("div","sheet-s",(MUSCLE&&MUSCLE[E.n]?MUSCLE[E.n]:"Deine Übung")+(lp?" · zuletzt "+lp.sets.map(s=>s.kg+"×"+s.reps).slice(0,2).join(", "):"")));
    const row=mk("div"); row.style.cssText="display:flex;gap:10px";
    [["sets","Sätze","numeric"],["reps","Wdh.","numeric"],["kg","kg","decimal"]].forEach(([k,l,im])=>{
      const fd=mk("div","field"); fd.style.flex="1";
      fd.innerHTML='<input type="number" inputmode="'+im+'" step="'+(k==="kg"?"0.5":"1")+'" value="'+esc(E[k])+'" placeholder="'+(k==="kg"?"0":"")+'"><u>'+l+'</u>';
      fd.querySelector("input").addEventListener("input",e=>{E[k]=e.target.value;});
      row.appendChild(fd);
    });
    p.appendChild(row);
    p.appendChild(mk("div","note","Ohne Gewicht (Körpergewicht) das kg-Feld leer lassen."));
    const sv=mk("button","btn",edit?"Speichern":"Hinzufügen");
    sv.addEventListener("click",()=>{
      const rec={n:E.n,sets:Math.max(1,Math.round(nn(E.sets))||3),reps:Math.max(1,Math.round(nn(E.reps))||12),kg:nn(E.kg)};
      if(edit) f.ex[i]=rec; else f.ex.push(rec);
      save(); closeSheet(); renderAll();
    });
    p.appendChild(sv);
    if(edit){
      const d=mk("button","btn plain","Übung entfernen");
      d.addEventListener("click",()=>{ f.ex.splice(i,1); save(); closeSheet(); renderAll(); });
      p.appendChild(d);
    }
    const c=mk("button","btn sec","Abbrechen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

function finishSheet2(kind){
  const f=FD();
  const est=kind==="kraft"?Math.max(15,f.ex.length*8):"";
  const E={min:kind==="kraft"?String(est):f.min,eff:f.eff||1};
  const draw=()=>openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Einheit abschließen"));
    p.appendChild(mk("div","sheet-s",kind==="kraft"?f.ex.length+" Übungen":f.type));
    const fd=mk("div","field"); fd.innerHTML='<input type="number" inputmode="numeric" value="'+esc(E.min)+'" placeholder="Dauer"><u>min</u>';
    fd.querySelector("input").addEventListener("input",e=>{E.min=e.target.value;});
    p.appendChild(fd);
    const l=mk("div","sect","Wie war es?"); l.style.padding="14px 4px 7px"; p.appendChild(l);
    const seg=mk("div","seg"); seg.style.marginTop="0";
    EFF.forEach(([t,v])=>{ const b=mk("button",E.eff===v?"on":"",t); b.addEventListener("click",()=>{E.eff=v; draw();}); seg.appendChild(b); });
    p.appendChild(seg);
    const sv=mk("button","btn","Speichern");
    sv.addEventListener("click",()=>{
      const min=Math.round(nn(E.min));
      if(!(min>0)){ E.min=""; draw(); return; }
      commitFree(kind,min,E.eff);
    });
    p.appendChild(sv);
    const c=mk("button","btn sec","Abbrechen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
  draw();
}

function commitFree(kind,min,eff){
  const f=FD(), now=new Date().toISOString();
  const entry={date:now,day:"thu",week:S.week,dur:min*60,ex:[],prs:[],eff,free:true,src:"free"};
  if(kind==="kraft"){
    entry.label="Freier Tag · Kraft"; entry.kind="kraft";
    f.ex.forEach(x=>{
      const sets=Array.from({length:x.sets},()=>({kg:x.kg||0,reps:x.reps}));
      entry.ex.push({n:x.n,sets,rpe:null});
      const best=sets.reduce((a,b)=>e1rm(b.kg,b.reps)>e1rm(a.kg,a.reps)?b:a,sets[0]);
      const v=e1rm(best.kg,best.reps);
      if(v>0&&(!S.best[x.n]||v>S.best[x.n].e1rm+0.01)){ S.best[x.n]={e1rm:v,kg:best.kg,reps:best.reps,date:now}; entry.prs.push(x.n); }
    });
    S.flash="Freier Tag · "+f.ex.length+" Übungen, "+min+" Min"+(entry.prs.length?" · "+entry.prs.length+" neue Bestleistung"+(entry.prs.length>1?"en":""):"");
  }else{
    const km=nn(f.km), isRun=f.type==="Laufen"&&km>0;
    entry.label="Freier Tag · "+f.type;
    if(isRun){ entry.kind="run"; entry.run={km:+km.toFixed(2),min}; S.runs.thu={km:entry.run.km,min}; }
    else entry.kind="sonst";
    S.flash="Freier Tag · "+f.type+", "+min+" Min"+(isRun?", "+km+" km":"");
  }
  S.history.push(entry);
  f.done=true; f.histDate=now; f.min=String(min);
  save(); closeSheet(); renderAll();
}

function undoFree(){
  const f=FD();
  const i=S.history.findIndex(h=>h.free&&h.date===f.histDate);
  if(i>=0){
    const x=S.history[i];
    if(x.run&&S.runs.thu&&S.runs.thu.km===x.run.km) delete S.runs.thu;
    S.history.splice(i,1);
    if(x.ex&&x.ex.length){
      S.best={};
      S.history.forEach(h=>(h.ex||[]).forEach(e=>e.sets.forEach(s=>{
        const v=e1rm(s.kg,s.reps);
        if(v>0&&(!S.best[e.n]||v>S.best[e.n].e1rm)) S.best[e.n]={e1rm:v,kg:s.kg,reps:s.reps,date:h.date};
      })));
    }
  }
  f.done=false; f.histDate=null;
  save(); renderAll();
}

window.renderFree=function(root,D){
  const f=FD();
  root.appendChild(mk("div","sect","Dein freier Tag"));
  const seg=mk("div","seg"); seg.style.marginTop="0";
  [["kraft","Kraft"],["ausdauer","Ausdauer"],["ruhe","Ruhetag"]].forEach(([k,l])=>{
    const b=mk("button",f.mode===k?"on":"",l);
    b.addEventListener("click",()=>{ f.mode=f.mode===k?null:k; save(); renderAll(); });
    seg.appendChild(b);
  });
  root.appendChild(seg);

  if(!f.mode){
    root.appendChild(mk("div","note","Heute gehört dir. Such dir aus, wonach dir ist — Kraft, Ausdauer oder einfach Pause. Alles, was du einträgst, zählt in deine Auswertung."));
    return;
  }

  if(f.done){
    const g=mk("div","group"); g.style.marginTop="14px";
    g.appendChild(mk("div","row",'<div class="mark done">✓</div><div class="main"><div class="t">Erledigt</div><div class="s">'+esc(window.freeLabel())+(f.min?" · "+esc(f.min)+" Min":"")+'</div></div>'));
    root.appendChild(g);
    const u=mk("button","btn plain","Eintrag zurücknehmen"); u.addEventListener("click",undoFree); root.appendChild(u);
    if(f.mode==="kraft"&&f.ex.length){
      root.appendChild(mk("div","sect","Übungen"));
      const g2=mk("div","group");
      f.ex.forEach((x,i)=>g2.appendChild(mk("div","row",'<div class="mark done">'+(i+1)+'</div><div class="main"><div class="t">'+esc(x.n)+'</div><div class="s">'+x.sets+' × '+x.reps+(x.kg?' · '+x.kg+' kg':' · Körpergewicht')+'</div></div>')));
      root.appendChild(g2);
    }
    return;
  }

  if(f.mode==="kraft"){
    root.appendChild(mk("div","sect","Übungen<span class='aux'>"+(f.ex.length?f.ex.length+" gewählt":"")+"</span>"));
    if(!f.ex.length){
      const g=mk("div","group");
      TEMPL.forEach(t=>{
        const r=mk("div","row tap");
        r.innerHTML='<div class="mark lav">+</div><div class="main"><div class="t">'+esc(t.n)+'</div><div class="s">'+esc(t.ex.map(e=>e[0]).join(" · "))+'</div></div>';
        r.addEventListener("click",()=>{
          t.ex.forEach(e=>f.ex.push({n:e[0],sets:e[1],reps:e[2],kg:nn(lastKg(e[0]))}));
          save(); renderAll();
        });
        g.appendChild(r);
      });
      root.appendChild(g);
      root.appendChild(mk("div","note","Starte mit einer Vorlage oder stell dir alles selbst zusammen. Gewichte kommen aus deinem letzten Training, wenn es die Übung schon gab."));
    }else{
      const g=mk("div","group");
      f.ex.forEach((x,i)=>{
        const r=mk("div","row tap");
        r.innerHTML='<div class="mark">'+(i+1)+'</div><div class="main"><div class="t">'+esc(x.n)+'</div><div class="s">'+x.sets+' × '+x.reps+(x.kg?' · '+x.kg+' kg':' · Körpergewicht')+'</div></div>'+chev();
        r.addEventListener("click",()=>exSheet(i));
        g.appendChild(r);
      });
      root.appendChild(g);
    }
    const add=mk("button","btn sec","Übung hinzufügen"); add.addEventListener("click",pickSheet); root.appendChild(add);
    if(f.ex.length){
      const fin=mk("button","btn","Einheit abschließen"); fin.addEventListener("click",()=>finishSheet2("kraft")); root.appendChild(fin);
    }
    return;
  }

  if(f.mode==="ausdauer"){
    root.appendChild(mk("div","sect","Was machst du?"));
    const chips=mk("div","se-chips");
    ENDU.forEach(t=>{
      const c=mk("span","chip"+(f.type===t?" fill":""),esc(t)); c.style.cursor="pointer";
      c.addEventListener("click",()=>{ f.type=t; save(); renderAll(); });
      chips.appendChild(c);
    });
    root.appendChild(chips);
    root.appendChild(mk("div","sect","Umfang<span class='aux'>Strecke ist optional</span>"));
    const row=mk("div"); row.style.cssText="display:flex;gap:10px";
    const f1=mk("div","field"); f1.style.flex="1";
    f1.innerHTML='<input type="number" inputmode="numeric" value="'+esc(f.min)+'" placeholder="Dauer"><u>min</u>';
    f1.querySelector("input").addEventListener("input",e=>{f.min=e.target.value; save();});
    const f2=mk("div","field"); f2.style.flex="1";
    f2.innerHTML='<input type="number" inputmode="decimal" step="0.1" value="'+esc(f.km)+'" placeholder="Strecke"><u>km</u>';
    f2.querySelector("input").addEventListener("input",e=>{f.km=e.target.value; save();});
    row.appendChild(f1); row.appendChild(f2); root.appendChild(row);
    root.appendChild(mk("div","sect","Wie war es?"));
    const rp=mk("div","rpe");
    EFF.forEach(([t,v])=>{
      const b=mk("button",(f.eff||1)===v?"on":"",t);
      b.addEventListener("click",()=>{ f.eff=v; save(); renderAll(); });
      rp.appendChild(b);
    });
    root.appendChild(rp);
    const sv=mk("button","btn","Einheit speichern");
    sv.addEventListener("click",()=>{
      const min=Math.round(nn(f.min));
      if(!(min>0)){ f.min=""; renderAll(); return; }
      commitFree("ausdauer",min,f.eff||1);
    });
    root.appendChild(sv);
    if(f.type==="Laufen") root.appendChild(mk("div","note","Mit Strecke zählt der Lauf in deine Kilometer und das Tempo-Training mit."));
    return;
  }

  /* Ruhetag */
  root.appendChild(mk("div","sect","Heute"));
  const g=mk("div","group");
  REST_TIPS.forEach((t,i)=>{
    const id="thu|"+i, on=S.checks[id];
    const r=mk("div","row tap");
    r.innerHTML='<div class="mark'+(on?" done":" lav")+'">'+(on?"✓":"○")+'</div><div class="main"><div class="t">'+esc(t)+'</div></div>';
    r.addEventListener("click",()=>{ S.checks[id]=!on; save(); renderAll(); });
    g.appendChild(r);
  });
  root.appendChild(g);
  root.appendChild(mk("div","note","Ruhetage gehören zum Plan. Ohne sie kommt die Kraft nicht an."));
};
})();
</script>


<style>
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:24px;color-scheme:light;text-align:left}
.field input[type=text]{font-weight:500}
</style>
<script>
/* ============================================================
   ANALYSE ANPASSEN — Einheiten nachtragen, ändern, fehlende Tage klären
   Damit keine Einheit in der Auswertung fehlt.
   ============================================================ */
(function(){
const nn=v=>{const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0;};
const lk=d=>new Date(d).toLocaleDateString("sv-SE");                 // lokales Datum YYYY-MM-DD
const at=k=>{const p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2],12,0,0).toISOString();};
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const KEYS=["sun","mon","tue","wed","thu","fri","sat"];
const RD=()=>S.restDays||(S.restDays={});
const KINDS=[["run","Lauf"],["kraft","Kraft"],["rad","Rad"],["sonst","Anderes"]];
const EFF=[["leicht",0.8],["gut",1],["schwer",1.25]];
const mk=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const chev=()=>typeof CHEV!=="undefined"?CHEV:"";
const monday=()=>{const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return lk(d);};
const firstKey=()=>{
  let m=S.since||null;
  S.history.forEach(h=>{const k=lk(h.date); if(!m||k<m) m=k;});
  return m;
};
const fmtDay=d=>new Date(d).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short"});

/* ---------- Was fehlt noch? ---------- */
function missed(){
  if(!S.since){ S.since=lk(new Date()); save(); }
  const out=[];
  for(let i=1;i<=3;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=lk(d);
    if(k<S.since||RD()[k]) continue;
    const key=KEYS[d.getDay()], D=buildDay(key);
    const es=S.history.filter(h=>lk(h.date)===k);
    const need=[];
    if(D.ex&&D.ex.length&&!es.some(h=>!h.run)) need.push({kind:"kraft",label:D.title});
    if(D.run&&!es.some(h=>h.run)) need.push({kind:"run",label:D.run.label,km:D.run.km});
    if(D.free){
      const f=S.freeDay;
      if(f&&(f.mode==="kraft"||f.mode==="ausdauer")&&!f.done&&!es.length)
        need.push({kind:f.mode==="kraft"?"kraft":"sonst",label:"Freier Tag"});
    }
    if(need.length) out.push({k,d,key,need});
  }
  return out;
}

/* ---------- Fortschritt der Woche mitziehen ---------- */
function tickPlan(rec,k,dayKey,min){
  if(k<monday()||k>lk(new Date())) return;
  const D=buildDay(dayKey);
  if(rec.kind==="run"&&D.run&&!S.runs[dayKey]) S.runs[dayKey]={km:rec.run.km,min:min};
  if(rec.kind==="kraft"&&D.ex&&D.ex.length&&!liftStarted(D)){
    D.ex.forEach((ex,i)=>{
      for(let s=1;s<=ex.sets;s++){
        const id=sKey(D.key,i,s);
        if(!S.sets[id]) S.sets[id]={kg:ex.target||0,reps:parseInt(String(ex.reps),10)||0,assumed:true};
      }
    });
  }
}
function rebuildBest(){
  S.best={};
  S.history.forEach(h=>(h.ex||[]).forEach(e=>(e.sets||[]).forEach(s=>{
    const v=e1rm(s.kg,s.reps);
    if(v>0&&(!S.best[e.n]||v>S.best[e.n].e1rm)) S.best[e.n]={e1rm:v,kg:s.kg,reps:s.reps,date:h.date};
  })));
}

/* ---------- Eintrag anlegen oder ändern ---------- */
function entrySheet(init,idx){
  const edit=idx!=null, h=edit?S.history[idx]:null;
  const hasEx=!!(edit&&h.ex&&h.ex.length);
  const E=edit
    ? {k:lk(h.date),kind:h.kind||(h.run?"run":"kraft"),label:h.label||"",min:h.dur?Math.round(h.dur/60):"",km:h.run?h.run.km:"",eff:h.eff||1}
    : Object.assign({k:lk(new Date()),kind:"kraft",label:"",min:"",km:"",eff:1},init||{});
  let err="";
  const lab=t=>{const d=mk("div","sect",t); d.style.padding="14px 4px 7px"; return d;};

  const commit=()=>{
    const min=Math.round(nn(E.min)), km=nn(E.km);
    if(!(min>0)){ err="Trag die Dauer in Minuten ein."; draw(); return; }
    if(E.kind==="run"&&!(km>0)){ err="Trag die Strecke in Kilometern ein."; draw(); return; }
    if(!edit&&E.kind==="run"&&S.history.some(x=>x.run&&lk(x.date)===E.k&&Math.abs(x.run.km-km)<0.4)){
      if(!confirm("An dem Tag gibt es schon einen Lauf mit ähnlicher Strecke. Trotzdem speichern?")) return;
    }
    const date=at(E.k), dayKey=KEYS[new Date(date).getDay()];
    const name=(E.label||"").trim()||(E.kind==="run"?"Lauf":E.kind==="kraft"?"Kraft":E.kind==="rad"?"Rad":"Training");
    const rec=edit?h:{ex:[],src:"manual",week:S.week};
    Object.assign(rec,{date,day:dayKey,label:name,dur:min*60,kind:E.kind,eff:E.eff});
    if(E.kind==="run") rec.run={km:+km.toFixed(2),min}; else delete rec.run;
    if(!edit) S.history.push(rec);
    S.history.sort((a,b)=>new Date(a.date)-new Date(b.date));
    delete RD()[E.k];
    tickPlan(rec,E.k,dayKey,min);
    S.flash=(edit?"Eintrag geändert: ":"Nachgetragen: ")+name+" · "+fmtDay(date);
    save(); closeSheet(); renderAll();
  };
  const remove=()=>{
    if(!confirm("Diesen Eintrag löschen?")) return;
    const x=S.history[idx];
    if(x.run&&S.runs[x.day]&&S.runs[x.day].km===x.run.km&&S.runs[x.day].min===x.run.min) delete S.runs[x.day];
    if(x.free&&S.freeDay) S.freeDay.done=false;
    S.history.splice(idx,1);
    if(x.ex&&x.ex.length) rebuildBest();
    save(); closeSheet(); renderAll();
  };

  function draw(){
    openSheet(p=>{
      p.appendChild(mk("div","sheet-h",edit?"Einheit bearbeiten":"Einheit nachtragen"));
      p.appendChild(mk("div","sheet-s",edit
        ? "Datum, Dauer und Strecke lassen sich korrigieren."+(hasEx?" Die Sätze bleiben unverändert.":"")
        : "Für Training ohne App, ohne Uhr oder vergessen. Es zählt in Belastung, Form und Wochenübersicht."));

      p.appendChild(lab("Datum"));
      const fd=mk("div","field");
      fd.innerHTML='<input type="date" value="'+E.k+'" max="'+lk(new Date())+'">';
      fd.querySelector("input").addEventListener("input",e=>{ if(e.target.value) E.k=e.target.value; });
      p.appendChild(fd);

      if(!hasEx){
        p.appendChild(lab("Art"));
        const seg=mk("div","seg"); seg.style.marginTop="0";
        KINDS.forEach(([k,l])=>{
          const b=mk("button",E.kind===k?"on":"",l);
          b.addEventListener("click",()=>{ E.kind=k; err=""; draw(); });
          seg.appendChild(b);
        });
        p.appendChild(seg);
      }

      p.appendChild(lab("Umfang"));
      const row=mk("div"); row.style.cssText="display:flex;gap:10px";
      if(E.kind==="run"){
        const f1=mk("div","field"); f1.style.flex="1";
        f1.innerHTML='<input type="number" inputmode="decimal" step="0.1" value="'+esc(E.km)+'" placeholder="Strecke"><u>km</u>';
        f1.querySelector("input").addEventListener("input",e=>{E.km=e.target.value;});
        row.appendChild(f1);
      }
      const f2=mk("div","field"); f2.style.flex="1";
      f2.innerHTML='<input type="number" inputmode="numeric" value="'+esc(E.min)+'" placeholder="Dauer"><u>min</u>';
      f2.querySelector("input").addEventListener("input",e=>{E.min=e.target.value;});
      row.appendChild(f2);
      p.appendChild(row);

      if(E.kind!=="run"){
        p.appendChild(lab("Wie war es?"));
        const seg=mk("div","seg"); seg.style.marginTop="0";
        EFF.forEach(([l,v])=>{
          const b=mk("button",E.eff===v?"on":"",l);
          b.addEventListener("click",()=>{ E.eff=v; draw(); });
          seg.appendChild(b);
        });
        p.appendChild(seg);
      }

      p.appendChild(lab("Bezeichnung"));
      const fl=mk("div","field");
      fl.innerHTML='<input type="text" value="'+esc(E.label)+'" placeholder="optional">';
      fl.querySelector("input").addEventListener("input",e=>{E.label=e.target.value;});
      p.appendChild(fl);

      if(err) p.appendChild(mk("div","note",esc(err)));
      const sv=mk("button","btn",edit?"Änderungen speichern":"Einheit speichern");
      sv.addEventListener("click",commit);
      p.appendChild(sv);
      if(edit){
        const d=mk("button","btn plain","Eintrag löschen");
        d.addEventListener("click",remove);
        p.appendChild(d);
      }
      const c=mk("button","btn sec","Abbrechen");
      c.addEventListener("click",closeSheet);
      p.appendChild(c);
    });
  }
  draw();
}

/* ---------- Alle Einträge ---------- */
function listSheet(){
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Einträge"));
    p.appendChild(mk("div","sheet-s","Antippen zum Bearbeiten oder Löschen. Neueste zuerst."));
    const g=mk("div","group");
    const rows=S.history.map((h,i)=>({h,i})).sort((a,b)=>new Date(b.h.date)-new Date(a.h.date)).slice(0,40);
    if(!rows.length) g.appendChild(mk("div","row",'<div class="main"><div class="t">Noch keine Einträge</div></div>'));
    rows.forEach(({h,i})=>{
      const right=h.run?h.run.km+" km":h.dur?Math.round(h.dur/60)+" min":"";
      const r=mk("div","row tap");
      r.innerHTML='<div class="main"><div class="t">'+esc(h.label||"Einheit")+(h.src==="manual"?" ✎":"")+'</div><div class="s">'+fmtDay(h.date)+(h.run&&h.run.min?" · "+h.run.min+" min":"")+'</div></div><div class="v">'+esc(right)+'</div>'+chev();
      r.addEventListener("click",()=>entrySheet(null,i));
      g.appendChild(r);
    });
    p.appendChild(g);
    const c=mk("button","btn sec","Schließen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

/* ---------- Tage ohne Eintrag ---------- */
function gapStats(){
  const first=firstKey(); if(!first) return null;
  let none=0,rest=0,trained=0,total=0;
  const d=new Date(); d.setDate(d.getDate()-1);
  while(lk(d)>=first){
    const k=lk(d); total++;
    if(S.history.some(h=>lk(h.date)===k)) trained++;
    else if(RD()[k]) rest++;
    else none++;
    d.setDate(d.getDate()-1);
  }
  return {total,trained,rest,none};
}
function daysSheet(){
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Fehlende Tage"));
    p.appendChild(mk("div","sheet-s","Die letzten 28 Tage ohne Eintrag. Fehlende Aufzeichnung ist nicht dasselbe wie Ruhe — sag der Analyse, was es war."));
    const first=firstKey();
    const g=mk("div","group"); let n=0;
    for(let i=1;i<=28;i++){
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=lk(d);
      if(first&&k<first) break;
      if(S.history.some(h=>lk(h.date)===k)) continue;
      n++;
      const rest=!!RD()[k];
      const r=mk("div","row");
      r.innerHTML='<div class="main"><div class="t">'+fmtDay(d)+'</div><div class="s">'+(rest?"als Ruhetag markiert":"ohne Eintrag")+'</div></div>';
      const b1=mk("button","btn sm sec",rest?"Zurücknehmen":"Ruhetag");
      b1.addEventListener("click",()=>{ if(rest) delete RD()[k]; else RD()[k]=true; save(); renderAll(); daysSheet(); });
      r.appendChild(b1);
      if(!rest){
        const b2=mk("button","btn sm","Training");
        b2.addEventListener("click",()=>entrySheet({k}));
        r.appendChild(b2);
      }
      g.appendChild(r);
    }
    if(!n) g.appendChild(mk("div","row",'<div class="main"><div class="t">Alles geklärt</div><div class="s">Kein Tag ohne Eintrag</div></div>'));
    p.appendChild(g);
    const c=mk("button","btn sec","Schließen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

/* ---------- Hinweis auf offene Einheiten ---------- */
window.missedBanner=function(root){
  const m=missed(); if(!m.length) return;
  root.appendChild(mk("div","sect","Noch offen<span class='aux'>letzte 3 Tage</span>"));
  const g=mk("div","group");
  m.forEach(x=>{
    const what=x.need.map(n=>n.label+(n.km?" "+n.km+" km":"")).join(" + ");
    g.appendChild(mk("div","row",'<div class="main"><div class="t">'+WD[x.d.getDay()]+' · '+esc(what)+'</div><div class="s">Kein Eintrag — trainiert oder Ruhetag?</div></div>'));
    const act=mk("div","row"); act.style.gap="10px";
    const a=mk("button","btn sm","Nachtragen"); a.style.flex="1";
    a.addEventListener("click",()=>entrySheet(Object.assign({k:x.k},x.need[0])));
    const b=mk("button","btn sm sec","Ruhetag"); b.style.flex="1";
    b.addEventListener("click",()=>{ RD()[x.k]=true; save(); renderAll(); });
    act.appendChild(a); act.appendChild(b); g.appendChild(act);
  });
  root.appendChild(g);
};

/* ---------- Bereich „Analyse anpassen“ ---------- */
window.adjustCard=function(root){
  root.appendChild(mk("div","sect","Analyse anpassen"));
  const g=mk("div","group");
  const add=(t,s,fn)=>{
    const r=mk("div","row tap");
    r.innerHTML='<div class="main"><div class="t">'+t+'</div><div class="s">'+s+'</div></div>'+chev();
    r.addEventListener("click",fn); g.appendChild(r);
  };
  const st=gapStats();
  add("Einheit nachtragen","Training ohne App, ohne Uhr oder vergessen",()=>entrySheet());
  add("Einträge ansehen und ändern",S.history.length+" Einheiten",listSheet);
  add("Fehlende Tage prüfen",st?st.none+" ohne Eintrag · "+st.rest+" als Ruhetag markiert":"noch keine Tage zu prüfen",daysSheet);
  root.appendChild(g);

  root.appendChild(mk("div","sect","Gewichtung<span class='aux'>je Minute ohne Tempo</span>"));
  const seg=mk("div","seg"); const kw=S.kw||0.7;
  [["leicht",0.5],["normal",0.7],["hart",0.9]].forEach(([l,v])=>{
    const b=mk("button",kw===v?"on":"",l);
    b.addEventListener("click",()=>{ S.kw=v; save(); renderAll(); });
    seg.appendChild(b);
  });
  root.appendChild(seg);
  root.appendChild(mk("div","note","So stark zählt eine Minute Kraft, Rad oder anderer Sport in Belastung und Form. Läufe werden aus dem Tempo gerechnet und sind davon nicht betroffen."));
  if(st&&st.total>0)
    root.appendChild(mk("div","note","Seit Beginn: "+st.trained+" Tage mit Eintrag, "+st.rest+" als Ruhetag markiert, "+st.none+" ohne Angabe. Tage ohne Angabe gehen mit Belastung null ein — das ist keine Ruhe, sondern eine Lücke."));
};

/* ---------- Einhängen ---------- */
const base=window.renderAnalyse;
window.renderAnalyse=function(){
  if(base) base();
  const root=document.querySelector("#s-analyse"); if(!root) return;
  const holder=mk("div");
  window.missedBanner(holder);
  if(holder.children.length) root.insertBefore(holder,root.children[2]||null);
  window.adjustCard(root);
};
if(typeof renderAll==="function") renderAll();
})();
</script>
